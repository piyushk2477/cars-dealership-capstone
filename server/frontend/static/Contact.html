<main><h1>Contact us</h1><p>Questions about dealership listings or reviews? Send a message using the form below.</p><form onsubmit="event.preventDefault();document.getElementById('status').textContent='Thanks! This demo form does not send messages to a server.'"><label for="name">Name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="message">Message</label><textarea id="message" name="message" rows="4" required></textarea><button type="submit">Send message</button><p id="status" role="status"></p></form></main></body></html>
