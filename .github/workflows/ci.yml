name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: flake8 djangoapp server manage.py --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JSHint
        run: npm install --global jshint
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: |
          jshint server/frontend/vite.config.js
          npm install --prefix server/frontend
          npm run build --prefix server/frontend

  test:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test